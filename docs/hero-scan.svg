<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">M365 Red Team scan console</title>
  <desc id="desc">Product mock of an external Entra domain scan with High, Medium, and Low findings</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a24"/>
      <stop offset="55%" stop-color="#12352e"/>
      <stop offset="100%" stop-color="#1a463c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#e8f0eb"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#041510" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>
  <circle cx="820" cy="90" r="160" fill="#2f6b5a" opacity="0.18"/>
  <circle cx="120" cy="540" r="180" fill="#0e3f35" opacity="0.35"/>
  <path d="M0 420 C180 360 280 500 460 460 C640 420 740 300 960 340 L960 640 L0 640 Z" fill="#0c2f28" opacity="0.55"/>

  <g filter="url(#soft)">
    <rect x="78" y="68" width="804" height="504" rx="18" fill="url(#panel)"/>
    <rect x="78" y="68" width="804" height="56" rx="18" fill="#102820"/>
    <rect x="78" y="102" width="804" height="22" fill="#102820"/>
    <circle cx="112" cy="96" r="7" fill="#c45f1a"/>
    <circle cx="136" cy="96" r="7" fill="#d4a017"/>
    <circle cx="160" cy="96" r="7" fill="#2f9e6b"/>
    <text x="196" y="101" fill="#d7ebe2" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="600">External scan · contoso.com</text>
    <text x="780" y="101" fill="#8fb3a6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" text-anchor="end">12.4s</text>

    <text x="112" y="168" fill="#0b3d36" font-family="Sora, Segoe UI, sans-serif" font-size="28" font-weight="700">Severity summary</text>
    <text x="112" y="196" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15">Authorized domain · public endpoints only</text>

    <g>
      <rect x="112" y="228" width="220" height="118" rx="10" fill="#fff" stroke="#c9d6cf"/>
      <text x="132" y="262" fill="#b42318" font-family="Sora, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HIGH</text>
      <text x="132" y="308" fill="#b42318" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">4</text>
      <text x="176" y="308" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Fix first</text>

      <rect x="352" y="228" width="220" height="118" rx="10" fill="#fff" stroke="#c9d6cf"/>
      <text x="372" y="262" fill="#b54708" font-family="Sora, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MEDIUM</text>
      <text x="372" y="308" fill="#b54708" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">6</text>
      <text x="416" y="308" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Plan next</text>

      <rect x="592" y="228" width="220" height="118" rx="10" fill="#fff" stroke="#c9d6cf"/>
      <text x="612" y="262" fill="#175cd3" font-family="Sora, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LOW</text>
      <text x="612" y="308" fill="#175cd3" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">9</text>
      <text x="656" y="308" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Lower priority</text>
    </g>

    <rect x="112" y="372" width="700" height="148" rx="10" fill="#fff" stroke="#c9d6cf"/>
    <text x="132" y="408" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" letter-spacing="1.2">MOST LIKELY BYPASS</text>
    <text x="132" y="444" fill="#132018" font-family="Sora, Segoe UI, sans-serif" font-size="20" font-weight="700">Spoofed mail → device-code phishing</text>
    <text x="132" y="476" fill="#4d5c56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15">Missing DMARC plus reachable GetCredentialType shortens the path in.</text>
    <rect x="132" y="494" width="168" height="8" rx="4" fill="#0b3d36" opacity="0.85"/>
    <rect x="312" y="494" width="96" height="8" rx="4" fill="#c9d6cf"/>
    <rect x="420" y="494" width="64" height="8" rx="4" fill="#c9d6cf"/>
  </g>
</svg>
