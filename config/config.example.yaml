# Copy to config.yaml for your authorized assessment.
# Never commit real secrets.

tenant:
  # Domain you are authorized to scan (e.g. contoso.com)
  domain: "customer.onmicrosoft.com"
  tenant_id: ""

auth:
  # Not required for external-only scans
  client_id: ""
  client_secret: ""
  authority: "https://login.microsoftonline.com"
  scopes:
    - "https://graph.microsoft.com/.default"

openai:
  # Optional — AI narrative in the report
  api_key: ""
  model: "gpt-4o-mini"
  enabled: false

assessment:
  default_profile: "external"
  read_only: true
  demo_mode: false

reporting:
  output_dir: "output/reports"
  formats:
    - html
  organization: "Authorized Red Team Assessment"
